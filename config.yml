          title: W. Matthew Alampay Davis
          subtitle: |
              I am a Postdoctoral Researcher and Research Fellow at Nuffield College, Oxford where I am affiliated with the [Climate Econometrics programme.](https://www.climateeconometrics.org/about/)
              <br><br>
              My active research empirically studies the relationships between environmental change and social welfare, highlighting their implications for global inequality and development. I also maintain a secondary interest in [historical political economy](https://academic.oup.com/edited-volume/44005) as it pertains to the determination and persistence of social inequalities and deprivations. My work draws from interdisciplinary approaches and collaborations across the social and natural sciences.
              <br><br>
              I grew up in the Philippines, Indonesia, and Vietnam. I hold a BS from NYU, an MPhil from Oxford, and a PhD in economics from Columbia. Prior to my graduate studies, I worked at Stanford's Center on Food Security and the Environment as a research associate. In written work, I use "Alampay Davis" as my surname.
