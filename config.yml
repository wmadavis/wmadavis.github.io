          title: W. Matthew Alampay Davis
          subtitle: |
              I am a political economist working at the intersection of environmental, development, and welfare economics research. My approach to these broad subjects is distinguished by an emphasis on inequalities in the social impacts of anthropogenic climate change. Past projects have been published in *Science* and *Nature*.
              <br><br>
              I'm originally from Manila but grew up mostly in Jakarta and Ho Chi Minh City. I have since lived in New York, London, Shanghai, Stanford, and Oxford. I received a PhD in economics from Columbia in 2025, an MPhil from Oxford, and a BS from NYU Stern. I currently live in New York.
