          title: W. Matthew Alampay Davis
          subtitle: |
              I am a political economist working at the intersection of environmental, development, and welfare economics. In January 2026, I will be joining Nuffield College, Oxford as a postdoctoral researcher and affiliate of the Climate Econometrics project. I may be slow to respond to research-related communications until then.
              <br><br>
              My active research empirically investigates the impacts of environmental change on various aspects of social welfare and considers their implications for the scope, feasibility, and equitable design of climate and development policy. As such, my work draws from interdisciplinary literatures and collaborations across the social and natural sciences. I also maintain thematic interests in [historical political economy](https://digitalcommons.chapman.edu/cgi/viewcontent.cgi?article=1375&context=esi_working_papers) as it pertains to the determination of social inequality and deprivation.
              <br><br>
              I grew up moving around Southeast Asia and hold a bachelor's degree from NYU, an MPhil from Oxford, and a PhD in economics from Columbia. In written work, I use "Alampay Davis" as my surname.
