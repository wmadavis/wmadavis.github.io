{{- define "main" }}
<div style="text-align: center; max-width: 40rem; margin: 5rem auto; padding: 0 1rem;">
    <div style="font-size: clamp(80px, 18vw, 150px); font-weight: 700; line-height: 1; color: var(--primary);">404</div>
    <h1 style="margin: 0.5rem 0 0;">Page not found</h1>
    <p style="color: var(--secondary);">
        The page you're looking for doesn't exist or may have moved.
    </p>
    <p style="margin-top: 1.5rem;">
        <a href="{{ "" | absLangURL }}" style="font-weight: 600;">&larr; Back to home</a>
    </p>
    <p style="color: var(--secondary); font-size: 0.9em;">
        Or head to
        <a href="{{ "research/" | absLangURL }}">Research</a>,
        <a href="{{ "teaching/" | absLangURL }}">Teaching</a>,
        <a href="{{ "resources/" | absLangURL }}">Resources</a>, or
        <a href="{{ "search/" | absLangURL }}">Search</a>.
    </p>
</div>
{{- end }}{{/* end main */ -}}
